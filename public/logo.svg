      .caret { fill: #3276ed; }
    }
  </style>
  <rect class="surface" x="1" y="6" width="30" height="20" rx="6" />
  <circle class="mask" cx="10" cy="16" r="2.25" />
  <circle class="mask" cx="17" cy="16" r="2.25" />
  <rect class="caret" x="23" y="11" width="2" height="10" rx="1" />
</svg>
