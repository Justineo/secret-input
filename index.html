<!doctype html>
<html lang="en" data-overlayscrollbars-initialize>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stop aggressive browser autofill from silently corrupting non-login secret fields."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="stylesheet"
      href="/node_modules/overlayscrollbars/styles/overlayscrollbars.scriptingenabled.css"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <title>Secret Input</title>
  </head>
  <body data-overlayscrollbars-initialize>
    <div class="shell">
      <a class="skip-link" href="#main">Skip to content</a>

      <header class="site-header">
        <div class="masthead">
          <span class="brand">
            <img class="logo" src="/logo.svg" alt="" width="32" height="32" />
            Secret Input
          </span>
          <nav class="site-nav" aria-label="Project">
            <a class="site-link" href="https://github.com/Justineo/secret-input#readme">
              Documentation
            </a>
          </nav>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <div id="demo-root">
          <p class="caption loading-message" role="status">Loading the comparison…</p>
          <noscript
            ><p class="caption">Enable JavaScript to try the interactive comparison.</p></noscript
          >
        </div>

        <template id="setup-template">
          <section class="page-section setup-page" aria-labelledby="setup-title">
            <div class="home">
              <header class="home-intro">
                <h1 id="setup-title" class="page-title">
                  Stop <span class="autofill-highlight">autofill</span> from corrupting secret
                  fields.
                </h1>
                <p class="lede">
                  Browsers can mistake API keys and other non-login secrets for saved credentials,
                  silently replacing correct values. Secret Input keeps autofill out of these
                  fields. Use native password inputs for login passwords.
                </p>
              </header>

              <section class="setup" aria-labelledby="setup-step-title">
                <h2 id="setup-step-title" class="section-title">Save a test login</h2>
                <p class="caption">
                  Use disposable credentials to create an autofill candidate. This page stores only
                  a local completion flag. Accept your browser’s save prompt after submitting.
                </p>
                <form id="credential-form" class="setup-form" action="./" method="post">
                  <div class="field">
                    <label class="label" for="setup-username">Username</label>
                    <input
                      id="setup-username"
                      name="username"
                      type="text"
                      autocomplete="username"
                      required
                    />
                  </div>

                  <div class="field">
                    <label class="label" for="setup-password">Password</label>
                    <input
                      id="setup-password"
                      name="password"
                      type="password"
                      autocomplete="current-password"
                      required
                    />
                  </div>

                  <button
                    id="continue-setup"
                    class="form-button"
                    type="submit"
                    aria-describedby="password-manager-warning"
                    disabled
                  >
                    Save and compare
                  </button>
                  <p
                    id="password-manager-warning"
                    class="toast"
                    data-tone="warning"
                    role="alert"
                    hidden
                  ></p>
                </form>
              </section>
            </div>
          </section>
        </template>

        <template id="comparison-template">
          <section class="page-section comparison-page" aria-labelledby="comparison-title">
            <header class="comparison-intro">
              <div class="comparison-claim">
                <h1 id="comparison-title" class="page-title">What actually stops autofill?</h1>
                <p class="lede">Four implementations, tested against the same fields.</p>
              </div>

              <button id="reset-demo" class="text-button" type="button">Back to setup</button>
            </header>

            <div class="case-grid">
              <article class="comparison-case">
                <header class="case-summary">
                  <h2 class="section-title">Autocomplete off</h2>
                  <p class="caption">
                    A native password input with <code>autocomplete="off"</code>. Browsers may
                    ignore the hint and still classify the pair as login credentials.
                  </p>
                </header>
                <form class="case-form">
                  <div class="field">
                    <label class="label" for="native-webhook-url">Webhook URL</label>
                    <input id="native-webhook-url" type="text" autocomplete="off" />
                  </div>
                  <div class="field">
                    <label class="label" for="native-signing-secret">Signing secret</label>
                    <input id="native-signing-secret" type="password" autocomplete="off" />
                  </div>
                </form>
              </article>

              <article class="comparison-case">
                <header class="case-summary">
                  <h2 class="section-title">New-password</h2>
                  <p class="caption">
                    A native password input with <code>autocomplete="new-password"</code>. This
                    common workaround prevents silent saved-password fill, but still triggers
                    password and generated-password UI.
                  </p>
                </header>
                <form class="case-form">
                  <div class="field">
                    <label class="label" for="new-password-webhook-url">Webhook URL</label>
                    <input id="new-password-webhook-url" type="text" autocomplete="off" />
                  </div>
                  <div class="field">
                    <label class="label" for="new-password-signing-secret"> Signing secret </label>
                    <input
                      id="new-password-signing-secret"
                      type="password"
                      autocomplete="new-password"
                    />
                  </div>
                </form>
              </article>

              <article class="comparison-case">
                <header class="case-summary">
                  <h2 class="section-title">CSS masking</h2>
                  <p class="caption">
                    A text input with <code>-webkit-text-security: disc</code> when supported. It
                    avoids password UI in some browsers, but masks only visually and Safari still
                    shows autofill UI.
                  </p>
                </header>
                <form class="case-form">
                  <div class="field">
                    <label class="label" for="css-webhook-url">Webhook URL</label>
                    <input id="css-webhook-url" type="text" autocomplete="off" />
                  </div>
                  <div class="field">
                    <label class="label" for="css-signing-secret">Signing secret</label>
                    <input
                      id="css-signing-secret"
                      type="text"
                      autocomplete="off"
                      autocapitalize="off"
                      autocorrect="off"
                      spellcheck="false"
                    />
                  </div>
                </form>
              </article>

              <article class="comparison-case" data-recommended="true">
                <header class="case-summary">
                  <h2 class="section-title">Secret Input</h2>
                  <p class="caption">
                    A text input passed to <code>mask(input)</code>. Its DOM value holds bullets
                    while browser-written text stays out of state. Native password accessibility
                    cannot be reproduced; undo/redo and IME handling are best effort.
                  </p>
                </header>
                <form class="case-form">
                  <div class="field">
                    <label class="label" for="masked-webhook-url">Webhook URL</label>
                    <input id="masked-webhook-url" type="text" autocomplete="off" />
                  </div>
                  <div class="field">
                    <label class="label" for="masked-signing-secret">Signing secret</label>
                    <input
                      id="masked-signing-secret"
                      type="text"
                      autocomplete="off"
                      autocapitalize="off"
                      autocorrect="off"
                      spellcheck="false"
                    />
                  </div>
                </form>
              </article>
            </div>

            <section class="compatibility" aria-labelledby="compatibility-title">
              <header class="compatibility-header">
                <h2 id="compatibility-title" class="section-title">Compatibility</h2>
                <span id="compatibility-legend" class="legend">
                  <span>
                    <img
                      class="browser-icon"
                      data-support="supported"
                      src="/src/assets/browser-logos/chrome.png"
                      alt=""
                    />
                    Supported
                  </span>
                  <span>
                    <img
                      class="browser-icon"
                      data-support="best-effort"
                      src="/src/assets/browser-logos/chrome.png"
                      alt=""
                    />
                    Best effort
                  </span>
                  <span>
                    <img
                      class="browser-icon"
                      data-support="unsupported"
                      src="/src/assets/browser-logos/chrome.png"
                      alt=""
                    />
                    Unsupported
                  </span>
                </span>
              </header>
              <div
                class="table-wrap"
                tabindex="0"
                role="region"
                aria-labelledby="compatibility-title"
                data-density="compact"
                data-sticky-first="true"
                data-variant="comparison"
              >
                <table
                  aria-label="Browser support by implementation and behavior"
                  aria-describedby="compatibility-legend"
                >
                  <thead>
                    <tr>
                      <th scope="col">Behavior</th>
                      <th scope="col">Autocomplete off</th>
                      <th scope="col">New-password</th>
                      <th scope="col">CSS masking</th>
                      <th scope="col" data-recommended="true">Secret Input</th>
                    </tr>
                  </thead>
                  <tbody id="support-matrix"></tbody>
                </table>
              </div>
              <p id="support-detail" class="caption support-detail" role="status">
                Select a browser icon for details. Results reflect the tested desktop browsers;
                behavior can vary by version and settings.
              </p>
            </section>
          </section>
        </template>
      </main>

      <footer class="site-footer">
        <a href="https://github.com/Justineo">@Justineo</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/Justineo/secret-input/blob/main/LICENSE">MIT License</a>
      </footer>
    </div>

    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
