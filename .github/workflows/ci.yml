name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile -- --trust-lockfile
      - run: vp run check
      - run: vp test --run
      - run: vp pack
      - run: vp build
      - name: Deploy to Void
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: vp exec void deploy --skip-build --project secret-input
        env:
          VOID_TOKEN: ${{ secrets.VOID_TOKEN }}
